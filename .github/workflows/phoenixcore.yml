name: PhoenixCore checks
on:
  pull_request:
    paths: ['phoenixcore/**', 'phoenixcore-service/**', 'assets/app.js', '.github/workflows/phoenixcore.yml']
  push:
    branches: [main]
    paths: ['phoenixcore/**', 'phoenixcore-service/**', 'assets/app.js', '.github/workflows/phoenixcore.yml']
permissions:
  contents: read
jobs:
  character-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phoenixcore_test
          POSTGRES_PASSWORD: local_test
          POSTGRES_DB: phoenixcore_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test sheets, Discord interactions and persistent storage
        working-directory: phoenixcore-service
        env:
          PHOENIX_TEST_DATABASE_URL: postgresql://phoenixcore_test:local_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/phoenixcore_test
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Test the desktop and mobile dashboard
        env:
          PHOENIX_SCREENSHOTS: ${{ runner.temp }}/phoenixcore-screens
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          python phoenixcore-service/test/dashboard_browser.py
      - name: Attach dashboard screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: phoenixcore-dashboard
          path: ${{ runner.temp }}/phoenixcore-screens
          retention-days: 3
